<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Orírùn — Consultations</title>
<style>
  :root{
    --bg:#f6f4ec; --card:#fffef9; --ink:#2c352c; --muted:#6a756a;
    --line:#e2e6dc; --primary:#0f7b3d; --primary-ink:#0b5a2c;
    --warn:#b4690e; --danger:#b23b3b; --chip:#eef3ea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--primary)}
  header{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{font-size:1.05rem;margin:0;font-weight:600}
  header .who{font-size:.82rem;opacity:.9}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .grid{display:grid;gap:12px}
  /* Totals */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .tile .v{font-size:1.25rem;font-weight:700;margin-top:4px}
  .tile .v.owed{color:var(--warn)} .tile .v.pos{color:var(--primary-ink)}
  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .toolbar input,.toolbar select,.form input,.form select,.form textarea{
    font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);max-width:100%}
  .btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--primary);
    background:var(--primary);color:#fff;cursor:pointer}
  .btn.secondary{background:#fff;color:var(--primary)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.danger{background:#fff;color:var(--danger);border-color:#e6cccc}
  .btn.sm{padding:6px 12px;font-size:.85rem}
  .spacer{flex:1}
  /* Table */
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table{border-collapse:collapse;width:100%;min-width:720px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#faf9f3;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  td.wrap{white-space:normal;min-width:160px}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:.78rem;font-weight:600}
  .chip.requested{background:#eef0f4;color:#51607a}
  .chip.paid{background:#e7f1ea;color:var(--primary-ink)}
  .chip.delivered{background:#e4efff;color:#2a5aa0}
  .chip.closed{background:#eceef0;color:#555}
  .chip.cancelled{background:#f6e7e7;color:var(--danger)}
  .chip.owed{background:#fbefdc;color:var(--warn)} .chip.payout-paid{background:#e7f1ea;color:var(--primary-ink)}
  /* Form panel */
  .overlay{position:fixed;inset:0;background:rgba(20,30,20,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .panel{background:var(--card);border-radius:16px;max-width:560px;width:100%;padding:20px}
  .panel h2{margin:0 0 4px;font-size:1.05rem}
  .form{display:grid;gap:12px;margin-top:14px}
  .form label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form input,.form select,.form textarea{width:100%}
  .form textarea{min-height:64px;resize:vertical}
  .form .full{grid-column:1/-1}
  .splitpreview{font-size:.85rem;color:var(--muted);background:#faf9f3;border:1px dashed var(--line);border-radius:9px;padding:8px 10px}
  details.more{border-top:1px solid var(--line);padding-top:10px}
  details.more>summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--primary-ink);list-style:none;user-select:none}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary:before{content:"▸ "}
  details.more[open]>summary:before{content:"▾ "}
  .msg{padding:10px 12px;border-radius:9px;margin:10px 0;font-size:.9rem}
  .msg.err{background:#f8e9e9;color:var(--danger)} .msg.ok{background:#e7f1ea;color:var(--primary-ink)}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}
  @media(max-width:540px){ .form .row{grid-template-columns:1fr} th,td{padding:9px 10px} }
</style>
</head>
<body>
<header>
  <h1>🧿 Orírùn — Consultations</h1>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
    <span class="who" id="who"></span>
    <a class="btn ghost sm" href="./index.html">Studio</a>
    <button class="btn ghost sm" id="signout" style="display:none" onclick="signOut()">Sign out</button>
  </div>
</header>
<div class="wrap">
  <div id="boot" class="card center muted">Loading…</div>
  <div id="app" style="display:none"></div>
</div>

<!-- Create / edit form -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="panel">
    <h2 id="formTitle">New consultation</h2>
    <div class="muted" style="font-size:.85rem">Seeker details stay private to you — the babaláwo never sees contact details.</div>
    <div id="formMsg"></div>
    <div class="form">
      <input type="hidden" id="f_id" />
      <div class="row">
        <div><label>Seeker name</label><input id="f_seekerName" placeholder="e.g. Tunde A." /></div>
        <div><label>Seeker WhatsApp / phone</label><input id="f_seekerContact" placeholder="+234…" /></div>
      </div>
      <div class="row">
        <div><label>Request type</label>
          <select id="f_requestType">
            <option value="destiny">Destiny</option>
            <option value="relationship">Relationship</option>
            <option value="money">Money / work</option>
            <option value="health">Health</option>
            <option value="protection">Protection</option>
            <option value="spiritual">Spiritual</option>
            <option value="other" selected>Other</option>
          </select>
        </div>
        <div><label>Assigned babaláwo (username)</label>
          <input id="f_babalawoUsername" list="babalawoList" placeholder="their platform username" />
          <datalist id="babalawoList"></datalist>
        </div>
      </div>
      <div class="row">
        <div><label>Amount</label><input id="f_amount" type="number" min="0" step="1" value="0" oninput="renderSplit()" /></div>
        <div><label>Status</label>
          <select id="f_status">
            <option value="requested">Requested</option>
            <option value="paid">Paid</option>
            <option value="delivered">Delivered</option>
            <option value="closed">Closed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div class="splitpreview" id="splitPreview"></div>
      <details class="more full">
        <summary>More details</summary>
        <div class="form" style="margin-top:12px">
          <div class="row">
            <div><label>Platform %</label><input id="f_platformPct" type="number" min="0" max="100" step="1" value="30" oninput="renderSplit()" /></div>
            <div><label>Babaláwo payout</label><select id="f_payoutStatus"><option value="owed">Owed</option><option value="paid">Paid</option></select></div>
          </div>
          <div class="row">
            <div><label>Payment reference</label><input id="f_paymentRef" placeholder="transfer ref" /></div>
            <div><label>Currency</label><input id="f_currency" value="NGN" /></div>
          </div>
          <div class="full"><label>Babaláwo display name (optional)</label><input id="f_babalawoName" placeholder="e.g. Awo Ifáyemí" /></div>
          <div class="full"><label>Request note (what the seeker asked)</label><textarea id="f_requestNote" placeholder="Short summary of the question"></textarea></div>
          <div class="full"><label>Internal notes (only you)</label><textarea id="f_notes"></textarea></div>
        </div>
      </details>
      <div class="full" style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn ghost" type="button" onclick="closeForm()">Cancel</button>
        <button class="btn danger" type="button" id="deleteBtn" style="display:none" onclick="removeEntry()">Delete</button>
        <button class="btn" type="button" id="saveBtn" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── API base: same resolution the studio uses ──────────────── */
var BACKEND_URL = "https://ancestra-nhhh.onrender.com";
var STATIC_HOSTS = ["orirun.com", "www.orirun.com", "daygea.github.io"];
var API_BASE = (localStorage.getItem("orirun_admin_api"))
  || (location.protocol.indexOf("http") === 0
        ? (STATIC_HOSTS.indexOf(location.hostname) >= 0 ? BACKEND_URL : location.origin)
        : BACKEND_URL);

function api(path, opts){
  opts = opts || {};
  return fetch(API_BASE + "/api/studio/consultations" + path, {
    credentials: "include",
    headers: Object.assign({ "Content-Type": "application/json" }, opts.headers || {}),
    method: opts.method || "GET",
    body: opts.body
  });
}
function money(n, cur){
  n = Number(n) || 0; cur = cur || "NGN";
  try { return new Intl.NumberFormat("en-NG", { style:"currency", currency:cur, maximumFractionDigits:0 }).format(n); }
  catch(e){ return (cur === "NGN" ? "₦" : cur + " ") + n.toLocaleString(); }
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
var ME = null;

/* ── Boot: who am I? ─────────────────────────────────────────── */
(async function boot(){
  try{
    var res = await fetch(API_BASE + "/api/auth/me", { credentials:"include" });
    var j = await res.json().catch(function(){ return {}; });
    if(!res.ok || !j.authenticated){ return showSignIn(); }
    ME = j;
    el("who").textContent = (j.username || j.role) + " · " + j.role;
    el("signout").style.display = "";
    if(j.role === "superadmin") return initAdmin();
    if(j.role === "babalawo" || j.role === "elder") return initBabalawo();
    return showNoAccess();
  }catch(e){ showSignIn(); }
})();

function showSignIn(){
  el("boot").style.display="none"; el("app").style.display="block";
  el("app").innerHTML = '<div class="card center"><p>Please sign in to the studio first, then reopen this page.</p>'
    + '<p><a class="btn secondary" href="./index.html">Go to the studio sign-in</a></p></div>';
}
function showNoAccess(){
  el("boot").style.display="none"; el("app").style.display="block";
  el("app").innerHTML = '<div class="card center"><p>The consultations ledger is available to the administrator and to babaláwos and elders for their own records.</p></div>';
}
async function signOut(){
  try{ await fetch(API_BASE + "/api/auth/logout", { method:"POST", credentials:"include" }); }catch(e){}
  location.href = "./index.html";
}

/* ════════════════ BABALÁWO: my consultations (read-only) ════════════════ */
async function initBabalawo(){
  el("boot").style.display="none"; el("app").style.display="block";
  el("app").innerHTML = '<div class="muted">Loading your consultations…</div>';
  try{
    var res = await api("/mine"); var j = await res.json();
    if(!res.ok) throw new Error(j.error || "Could not load");
    var t = j.totals || {earned:0,owed:0,paid:0,count:0};
    var html = '<div class="tiles">'
      + tile("Consultations", t.count)
      + tile("Total earned", money(t.earned), "pos")
      + tile("Awaiting payout", money(t.owed), "owed")
      + tile("Paid to you", money(t.paid), "pos")
      + '</div>';
    if(!j.entries.length){ html += '<div class="empty">No consultations assigned to you yet.</div>'; }
    else{
      html += '<div class="tablewrap"><table><thead><tr>'
        + '<th>Ref</th><th>Date</th><th>Seeker</th><th>Type</th><th>Amount</th><th>Your share</th><th>Status</th><th>Payout</th></tr></thead><tbody>';
      j.entries.forEach(function(r){
        html += '<tr><td>'+esc(r.ref)+'</td><td>'+fmtDate(r.createdAt)+'</td><td>'+esc(r.seekerName)+'</td>'
          + '<td>'+esc(r.requestType)+'</td><td>'+money(r.amount,r.currency)+'</td>'
          + '<td><b>'+money(r.babalawoShare,r.currency)+'</b></td>'
          + '<td>'+statusChip(r.status)+'</td><td>'+payoutChip(r.payoutStatus)+'</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    el("app").innerHTML = html;
  }catch(e){ el("app").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}

/* ════════════════ SUPERADMIN: full ledger ════════════════ */
var filters = { status:"", payoutStatus:"", q:"", page:1 };

async function initAdmin(){
  el("boot").style.display="none"; el("app").style.display="block";
  el("app").innerHTML =
    '<div id="tiles" class="tiles"></div>'
    + '<div class="toolbar">'
    +   '<input id="q" placeholder="Search ref, seeker, babaláwo…" style="min-width:200px" oninput="debouncedSearch()"/>'
    +   '<select id="fStatus" onchange="applyFilters()"><option value="">All statuses</option>'
    +     '<option value="requested">Requested</option><option value="paid">Paid</option>'
    +     '<option value="delivered">Delivered</option><option value="closed">Closed</option><option value="cancelled">Cancelled</option></select>'
    +   '<select id="fPayout" onchange="applyFilters()"><option value="">Any payout</option>'
    +     '<option value="owed">Owed</option><option value="paid">Paid</option></select>'
    +   '<span class="spacer"></span>'
    +   '<button class="btn" onclick="openForm()">+ New consultation</button>'
    + '</div>'
    + '<div id="list"></div>'
    + '<div id="pager" class="center muted" style="margin-top:14px"></div>';
  loadBabalawoPicker();
  refreshSummary();
  loadList();
}

function tile(k,v,cls){ return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'; }

async function refreshSummary(){
  try{
    var res = await api("/summary"); var s = await res.json();
    if(!res.ok) return;
    el("tiles").innerHTML =
      tile("Collected", money(s.collected), "pos")
      + tile("Your platform share", money(s.platform), "pos")
      + tile("Owed to babaláwos", money(s.babalawoOwed), "owed")
      + tile("Paid to babaláwos", money(s.babalawoPaid))
      + tile("Total consultations", s.count);
  }catch(e){}
}

var _searchT=null;
function debouncedSearch(){ clearTimeout(_searchT); _searchT=setTimeout(applyFilters,300); }
function applyFilters(){
  filters.q = el("q") ? el("q").value.trim() : "";
  filters.status = el("fStatus") ? el("fStatus").value : "";
  filters.payoutStatus = el("fPayout") ? el("fPayout").value : "";
  filters.page = 1; loadList();
}

async function loadList(){
  el("list").innerHTML = '<div class="muted">Loading…</div>';
  var p = new URLSearchParams();
  if(filters.status) p.set("status",filters.status);
  if(filters.payoutStatus) p.set("payoutStatus",filters.payoutStatus);
  if(filters.q) p.set("q",filters.q);
  p.set("page",filters.page);
  try{
    var res = await api("/?"+p.toString()); var j = await res.json();
    if(!res.ok) throw new Error(j.error || "Could not load");
    _adminRows = j.entries || [];
    if(!j.entries.length){ el("list").innerHTML = '<div class="empty">No consultations yet. Tap “+ New consultation” to record the first one.</div>'; el("pager").textContent=""; return; }
    var html = '<div class="tablewrap"><table><thead><tr>'
      + '<th>Ref</th><th>Date</th><th>Seeker</th><th>Type</th><th>Babaláwo</th><th>Amount</th><th>Babaláwo share</th><th>Status</th><th>Payout</th><th></th></tr></thead><tbody>';
    j.entries.forEach(function(r, i){
      html += '<tr>'
        + '<td>'+esc(r.ref)+'</td><td>'+fmtDate(r.createdAt)+'</td>'
        + '<td class="wrap">'+esc(r.seekerName||'—')+'<div class="muted" style="font-size:.78rem">'+esc(r.seekerContact||'')+'</div></td>'
        + '<td>'+esc(r.requestType)+'</td>'
        + '<td>'+esc(r.babalawoName||r.babalawoUsername||'—')+'</td>'
        + '<td>'+money(r.amount,r.currency)+'</td>'
        + '<td>'+money(r.babalawoShare,r.currency)+'</td>'
        + '<td>'+statusChip(r.status)+'</td><td>'+payoutChip(r.payoutStatus)+'</td>'
        + '<td><button class="btn ghost sm" onclick="editEntry('+i+')">Edit</button></td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
    el("list").innerHTML = html;
    el("pager").innerHTML = j.pages>1
      ? pageBtn("‹ Prev", filters.page>1, filters.page-1) + ' Page '+j.page+' of '+j.pages+' ' + pageBtn("Next ›", filters.page<j.pages, filters.page+1)
      : '';
  }catch(e){ el("list").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}
function pageBtn(label, on, page){ return on ? '<button class="btn ghost sm" onclick="gotoPage('+page+')">'+label+'</button>' : ''; }
function gotoPage(p){ filters.page=p; loadList(); }

async function loadBabalawoPicker(){
  try{
    var res = await api("/babalawos"); var j = await res.json();
    if(!res.ok) return;
    el("babalawoList").innerHTML = (j.babalawos||[]).map(function(b){ return '<option value="'+esc(b.username)+'">'; }).join("");
  }catch(e){}
}

/* ── Form ── */
var _adminRows = [];
function openForm(){ fillForm(null); el("overlay").classList.add("open"); }
function closeForm(){ el("overlay").classList.remove("open"); el("formMsg").innerHTML=""; }
function editEntry(i){ var r = _adminRows[i]; if(r){ fillForm(r); el("overlay").classList.add("open"); } }

function fillForm(r){
  el("formTitle").textContent = r ? ("Edit "+r.ref) : "New consultation";
  el("deleteBtn").style.display = r ? "" : "none";
  el("f_id").value = r ? r._id : "";
  var set = function(id,v){ el(id).value = v==null?"":v; };
  set("f_seekerName", r && r.seekerName); set("f_seekerContact", r && r.seekerContact);
  el("f_requestType").value = (r && r.requestType) || "other";
  set("f_babalawoUsername", r && r.babalawoUsername); set("f_babalawoName", r && r.babalawoName);
  set("f_requestNote", r && r.requestNote);
  set("f_amount", r ? r.amount : 0); set("f_platformPct", r ? r.platformPct : 30);
  set("f_paymentRef", r && r.paymentRef); set("f_currency", (r && r.currency) || "NGN");
  el("f_status").value = (r && r.status) || "requested";
  el("f_payoutStatus").value = (r && r.payoutStatus) || "owed";
  set("f_notes", r && r.notes);
  renderSplit();
}
function renderSplit(){
  var amt = Math.max(0, Math.round(Number(el("f_amount").value)||0));
  var pct = Math.min(100, Math.max(0, Number(el("f_platformPct").value)||0));
  var plat = Math.round(amt*pct/100); var baba = amt-plat;
  el("splitPreview").innerHTML = "Split — you keep <b>"+money(plat)+"</b> ("+pct+"%), babaláwo gets <b>"+money(baba)+"</b>";
}
async function saveEntry(){
  var id = el("f_id").value;
  var payload = {
    seekerName: el("f_seekerName").value, seekerContact: el("f_seekerContact").value,
    requestType: el("f_requestType").value, requestNote: el("f_requestNote").value,
    babalawoUsername: el("f_babalawoUsername").value, babalawoName: el("f_babalawoName").value,
    amount: el("f_amount").value, platformPct: el("f_platformPct").value,
    paymentRef: el("f_paymentRef").value, currency: el("f_currency").value,
    status: el("f_status").value, payoutStatus: el("f_payoutStatus").value, notes: el("f_notes").value
  };
  el("saveBtn").disabled = true; el("formMsg").innerHTML="";
  try{
    var res = await api(id ? "/"+id : "/", { method: id?"PUT":"POST", body: JSON.stringify(payload) });
    var j = await res.json();
    if(!res.ok) throw new Error(j.error || "Save failed");
    closeForm(); refreshSummary(); loadList();
  }catch(e){ el("formMsg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
  finally{ el("saveBtn").disabled = false; }
}
async function removeEntry(){
  var id = el("f_id").value; if(!id) return;
  if(!confirm("Delete this consultation record? This cannot be undone.")) return;
  try{
    var res = await api("/"+id, { method:"DELETE" }); var j = await res.json();
    if(!res.ok) throw new Error(j.error || "Delete failed");
    closeForm(); refreshSummary(); loadList();
  }catch(e){ el("formMsg").innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
}

/* ── small helpers ── */
function fmtDate(d){ if(!d) return "—"; try{ return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}); }catch(e){ return "—"; } }
function statusChip(s){ return '<span class="chip '+esc(s)+'">'+esc(s)+'</span>'; }
function payoutChip(p){ return '<span class="chip '+(p==="paid"?"payout-paid":"owed")+'">'+esc(p)+'</span>'; }
</script>
</body>
</html>
